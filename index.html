<!DOCTYPE html>
<html>
<head>
    <title>Sales Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #1da1f2, #00c6ff);
            text-align: center;
        }

        .box {
            background: white;
            padding: 20px;
            width: 380px;
            margin: auto;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
        }

        h1 {
            color: white;
        }

        select, input {
            width: 90%;
            padding: 8px;
            margin: 10px;
        }

        button {
            background: green;
            color: white;
            padding: 10px;
            width: 95%;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        h2 {
            color: #333;
        }
    </style>
</head>

<body>

<h1>Human Behavior Sales Prediction</h1>

<div class="box">

<form action="/predict" method="POST">

    <label>Festival:</label><br>
    <select name="festival" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Weekend:</label><br>
    <select name="weekend" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Salary Day:</label><br>
    <select name="salary_day" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Local Event:</label><br>
    <select name="local_event" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Number of Visitors:</label><br>
    <input type="number" name="visitors" required><br>

    <label>Month:</label><br>
    <select name="month" required>
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
    </select><br>

    <button type="submit">Predict Sales</button>

</form>

{% if result %}
    <h2>Predicted Sales: ₹ {{ result }}</h2>
{% endif %}

</div>

</body>
</html>
